name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all -- --check

      - name: Workspace versions aligned
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("Cargo.toml").read_text()
          block = re.search(r"\[workspace\.package\](.*?)\n\[", root, re.S)
          if not block:
              sys.exit("workspace.package missing")
          m = re.search(r'version = "([^"]+)"', block.group(1))
          if not m:
              sys.exit("workspace version not found")
          ver = m.group(1)
          bad = []
          for name, v in re.findall(
              r"(resuma(?:-macros|-flow)?)\s*=\s*\{[^}]*version\s*=\s*\"([^\"]+)\"",
              root,
          ):
              if v != ver:
                  bad.append(f"workspace.dependencies {name}={v} != {ver}")
          flow = pathlib.Path("crates/resuma-flow/Cargo.toml").read_text()
          if not re.search(r"resuma\s*=\s*\{\s*workspace\s*=\s*true\s*\}", flow):
              bad.append("crates/resuma-flow must use resuma = { workspace = true }")
          if not pathlib.Path("Cargo.lock").is_file():
              bad.append("Cargo.lock must be committed")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"workspace version {ver} ok")
          PY

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Supply chain (cargo-deny)
        run: cargo deny check bans licenses sources

      - name: Build JS runtime
        working-directory: runtime
        run: |
          npm ci
          npm run build
          npm run size

      - name: Assets match runtime dist
        run: |
          for f in loader.js core.js lifecycle.js flow.js runtime.js ui.js ui.css; do
            cmp -s "runtime/dist/$f" "crates/resuma/assets/$f" \
              || { echo "Mismatch: $f — run npm run build in runtime/ and copy dist → crates/resuma/assets/"; exit 1; }
          done
          echo "assets in sync with runtime/dist"

      - name: Install E2E browser
        run: |
          npm ci
          npx playwright install chromium

      - name: Browser E2E
        run: npm run e2e:all

      - name: SQLx (ephemeral SQLite)
        run: cargo test -p example-resuma-audit sqlx_ci

      - name: Benchmark (Resuma only)
        run: node benchmark/run.mjs --resuma-only --skip-build
